[pytest]
testpaths = tests
addopts = -ra --strict-markers --junitxml=test-results/junit.xml
markers =
    smoke: critical-path checks, run on every push (fast)
    regression: guards against previously found defects
    ui: drives a real browser
    api: HTTP-level tests, no browser
    known_bug: documents an open defect in BUGS.md (expected to fail until fixed)
